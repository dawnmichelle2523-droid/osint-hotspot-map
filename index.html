<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OSINT Map</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css">
  <style>
    :root {
      color-scheme: dark;
      --bg: #080f1a;
      --panel: rgba(13, 23, 38, 0.86);
      --card-bg: linear-gradient(145deg, rgba(17, 29, 48, 0.95), rgba(11, 19, 32, 0.95));
      --line: rgba(56, 189, 248, 0.16);
      --text: #f1f5f9;
      --muted: #94a3b8;
      --active: #1d4ed8;
      --active-line: #38bdf8;
      --high: #f43f5e;
      --incident: #f59e0b;
      --maritime: #06b6d4;
      --travel: #3b82f6;
    }
    * { box-sizing: border-box; }
    html, body { height: auto; min-height: 100%; margin: 0; overflow-x: hidden; overflow-y: auto; background: var(--bg); color: var(--text); font: 14px/1.4 "Segoe UI", system-ui, sans-serif; }
    #stage { position: relative; height: 75vh; background: var(--bg); }
    #map { position: absolute; inset: 0; background: var(--bg); }
    #filter-toggle {
      position: absolute; z-index: 950; top: 12px; left: 12px;
      background: rgba(13, 23, 38, 0.92); color: var(--text);
      border: 1px solid var(--line); border-radius: 8px;
      padding: 7px 10px; font: inherit; font-size: 13px; font-weight: 650; cursor: pointer;
    }
    body.filters-open #filter-toggle { left: 12px; }
    #sidebar {
      position: absolute; z-index: 900; top: 0; left: 0; bottom: 0; width: 280px;
      padding: 52px 14px 16px; overflow: auto;
      background: var(--panel); border-right: 1px solid var(--line);
      backdrop-filter: blur(12px);
      transform: translateX(0); transition: transform 0.22s ease;
    }
    body.filters-closed #sidebar { transform: translateX(-100%); }
    #sidebar h1 { margin: 0; font-size: 16px; }
    #updated, #status, #search-count { margin: 4px 0 0; color: var(--muted); font-size: 12px; }
    #status:empty, #search-count:empty { display: none; }
    #status { color: var(--incident); }
    .search-row {
      display: flex; align-items: center; margin-top: 12px;
      background: rgba(8, 15, 26, 0.55); border: 1px solid var(--line); border-radius: 9px;
      padding: 0 4px 0 10px;
    }
    #search-input {
      flex: 1; min-width: 0; background: transparent; border: 0; color: var(--text);
      font: inherit; font-size: 13px; padding: 8px 0; outline: none;
    }
    #search-input::placeholder { color: var(--muted); }
    #search-input::-webkit-search-cancel-button { display: none; }
    #search-clear {
      width: 28px; height: 28px; border: 0; border-radius: 7px;
      background: transparent; color: var(--text); font-size: 18px; cursor: pointer;
    }
    .chips, .row { display: flex; flex-wrap: wrap; gap: 6px; }
    .chips { margin-top: 8px; }
    .group { margin-top: 14px; }
    .group h2 { margin: 0 0 6px; font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); font-weight: 650; }
    button.pill, button.chip {
      background: rgba(8, 15, 26, 0.45); color: var(--text); border: 1px solid var(--line);
      border-radius: 999px; padding: 4px 9px; font: inherit; font-size: 12px; cursor: pointer;
    }
    button.pill[aria-pressed="true"] { background: var(--active); border-color: var(--active-line); color: #fff; }
    button.pill.sev-high[aria-pressed="true"] { background: #4c0519; border-color: var(--high); }
    button.pill.sev-medium[aria-pressed="true"], button.pill.sev-low[aria-pressed="true"] { background: #451a03; border-color: var(--incident); }
    button.pill:focus-visible, button.chip:focus-visible, #filter-toggle:focus-visible { outline: 2px solid var(--active-line); outline-offset: 2px; }
    .n { display: inline-block; margin-left: 4px; min-width: 1.1em; padding: 0 5px; border-radius: 999px; background: rgba(255, 255, 255, 0.1); font-variant-numeric: tabular-nums; }
    #quick-jump {
      position: absolute; z-index: 850; top: 12px; left: 292px;
      display: flex; flex-wrap: wrap; gap: 4px; max-width: calc(100% - 304px);
    }
    body.filters-closed #quick-jump { left: 108px; max-width: calc(100% - 120px); }
    #quick-jump button {
      background: var(--bg); color: var(--text); border: 1px solid var(--active-line);
      border-radius: 999px; padding: 3px 8px; font: inherit; font-size: 11px; font-weight: 650;
      cursor: pointer; white-space: nowrap;
    }
    #quick-jump button[aria-pressed="true"] { background: var(--active); color: #fff; }
    #quick-jump button:focus-visible, #copy-brief:focus-visible, #export-headlines:focus-visible, .copy-pin:focus-visible { outline: 2px solid var(--active-line); outline-offset: 2px; }
    .legend {
      position: absolute; z-index: 800; left: 292px; bottom: 12px;
      display: flex; gap: 8px; align-items: center;
      padding: 4px 8px; border-radius: 999px;
      background: rgba(13, 23, 38, 0.9); border: 1px solid var(--line);
      color: var(--text); font-size: 11px; white-space: nowrap;
    }
    body.filters-closed .legend { left: 12px; }
    .legend i { display: inline-block; width: 8px; height: 8px; margin-right: 4px; border-radius: 50%; border: 1px solid #fff; vertical-align: 0; }
    .pin-icon { background: transparent; border: none; }
    .pin { position: relative; width: 22px; height: 22px; }
    .pin .dot {
      position: absolute; left: 5px; top: 5px; width: 12px; height: 12px; border-radius: 50%;
      background: currentColor; border: 1.5px solid #fff;
      box-shadow: 0 0 6px 1px currentColor, 0 0 12px currentColor;
    }
    .pin.is-old { opacity: 0.55; }
    .pin .ring { position: absolute; inset: 2px; border-radius: 50%; border: 1.5px solid currentColor; opacity: 0; }
    .pin.is-fresh .ring { animation: pulse 1.8s ease-out infinite; }
    @keyframes pulse {
      0% { transform: scale(0.7); opacity: 0.75; }
      100% { transform: scale(1.9); opacity: 0; }
    }
    @media (prefers-reduced-motion: reduce) {
      .pin.is-fresh .ring { animation: none; opacity: 0.8; }
      #sidebar, .headline-card, .brief-card { transition: none; }
      .headline-card:hover, .brief-card:hover { transform: none; }
    }
    .marker-cluster-small, .marker-cluster-medium, .marker-cluster-large { background-color: rgba(56, 189, 248, 0.28); }
    .marker-cluster-small div, .marker-cluster-medium div, .marker-cluster-large div {
      background: #0d1726; color: var(--text); font-weight: 650;
    }
    .leaflet-popup-content-wrapper, .leaflet-popup-tip { background: #0d1726; color: var(--text); box-shadow: 0 8px 24px rgba(0, 0, 0, 0.45); }
    .leaflet-popup-content-wrapper { border-radius: 10px; border: 1px solid var(--line); }
    .leaflet-popup-content { margin: 10px 12px; max-width: 276px; }
    .leaflet-popup-close-button { color: #c5ceda !important; }
    .popup { width: 260px; max-width: 276px; }
    .popup h3 { margin: 0 0 6px; font-size: 14px; line-height: 1.3; }
    .badge { display: inline-block; border-radius: 999px; padding: 1px 7px; font-size: 10px; font-weight: 700; letter-spacing: 0.03em; }
    .badge-official { background: #10b981; color: #042f1f; border: 1px solid #10b981; }
    .badge-claim { background: #f59e0b; color: #451a03; border: 1px solid #f59e0b; }
    .badge-lead { background: #a855f7; color: #faf5ff; border: 1px solid #a855f7; }
    .badge-corroborated { background: #38bdf8; color: #082f49; border: 1px solid #38bdf8; }
    .badge-unknown { background: #1e293b; color: var(--muted); border: 1px solid var(--line); }
    .summary { margin: 6px 0; font-size: 13px; }
    .when { color: var(--muted); font-size: 12px; }
    a.popup-link { display: inline-block; margin-top: 8px; color: var(--active-line); text-decoration: none; font-size: 13px; font-weight: 650; }
    .leaflet-bottom.leaflet-right { margin-bottom: 4px; }
    #headlines {
      width: 100%; background: var(--bg); color: var(--text);
      border: 1px solid var(--line); padding: 28px 20px 48px; overflow-y: auto;
    }
    .headlines-inner { width: 100%; margin: 0 auto; }
    .headlines-head { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 0 0 6px; border-bottom: 2px solid var(--active-line); padding-bottom: 8px; }
    #headlines h2 { margin: 0; font-size: 22px; letter-spacing: -0.01em; flex: 1; }
    #export-headlines, #copy-brief { color: #fff; background: var(--active); border: 1px solid var(--active-line); border-radius: 8px; padding: 6px 10px; font: inherit; font-size: 13px; font-weight: 650; cursor: pointer; }
    .popup-actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 8px; }
    .popup-actions .popup-link { margin-top: 0; }
    .copy-pin { color: #fff; background: var(--active); border: 1px solid var(--active-line); border-radius: 8px; padding: 4px 8px; font: inherit; font-size: 12px; font-weight: 650; cursor: pointer; }
    .headlines-note { margin: 0 0 16px; color: var(--muted); font-size: 13px; }
    #headline-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 14px; }
    .headline-card {
      background: var(--card-bg); border: 1px solid var(--line); border-top: 1px solid rgba(56, 189, 248, 0.55);
      border-radius: 12px; padding: 14px 14px 12px; display: flex; flex-direction: column; gap: 8px;
      transition: transform 0.22s ease, box-shadow 0.22s ease;
    }
    .headline-card:hover { transform: translateY(-3px); box-shadow: 0 12px 28px rgba(2, 6, 16, 0.45); }
    .headline-meta { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
    .region-tag { background: var(--active); color: #fff; border-radius: 999px; padding: 1px 8px; font-size: 11px; font-weight: 650; }
    .headline-card h3 { margin: 0; font-size: 16px; line-height: 1.3; }
    .headline-card .summary { margin: 0; color: var(--text); }
    .headline-card time { color: var(--muted); font-size: 12px; margin-left: auto; }
    .headline-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: auto; }
    .headline-source, .locate {
      display: inline-block; border-radius: 8px; padding: 6px 10px; font: inherit; font-size: 13px; font-weight: 650;
      text-decoration: none; cursor: pointer;
    }
    .headline-source { color: var(--active-line); border: 1px solid var(--active-line); background: transparent; }
    .locate { color: #fff; background: var(--active); border: 1px solid var(--active-line); }
    .locate:focus-visible, .headline-source:focus-visible { outline: 2px solid var(--active-line); outline-offset: 2px; }
    .headline-empty { margin: 0; color: var(--muted); }
    #daily-brief { width: 100%; background: var(--bg); color: var(--text); border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); padding: 20px 20px 8px; }
    .brief-card {
      background: var(--card-bg); border: 1px solid var(--line); border-top: 1px solid rgba(56, 189, 248, 0.55);
      border-radius: 12px; padding: 12px 14px 6px; margin: 0 0 16px;
      transition: transform 0.22s ease, box-shadow 0.22s ease;
    }
    .brief-card:hover { transform: translateY(-3px); box-shadow: 0 12px 28px rgba(2, 6, 16, 0.45); }
    .brief-bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    #brief-title { margin: 0; font-size: 18px; font-weight: 700; }
    #brief-time { color: var(--muted); font-size: 12px; }
    #copy-brief { margin-left: auto; }
    #brief-body { margin-top: 8px; }
    .brief-section { border-top: 1px solid var(--line); }
    .brief-section-toggle { width: 100%; display: flex; align-items: center; gap: 8px; background: transparent; color: var(--active-line); border: 0; padding: 10px 0; font: inherit; font-size: 14px; font-weight: 700; text-align: left; cursor: pointer; }
    .brief-section-toggle::before { content: "▾"; color: var(--active-line); }
    .brief-section-toggle[aria-expanded="false"]::before { content: "▸"; }
    .brief-section-body { padding: 0 0 10px 18px; color: var(--text); }
    .brief-section-body[hidden] { display: none; }
    .brief-section-body p { margin: 0; }
    .brief-section-body ul { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 6px; }
    .brief-section-body li { display: flex; gap: 8px; align-items: flex-start; }
    @media (max-width: 720px) {
      #headlines, #daily-brief { padding-left: 14px; padding-right: 14px; }
      #headlines h2, #brief-title { font-size: 18px; }
      .headline-card time { margin-left: 0; }
      #copy-brief, #export-headlines { margin-left: 0; }
    }
  </style>
</head>
<body class="filters-open">
  <div id="stage">
  <button id="filter-toggle" type="button" aria-expanded="true" aria-controls="sidebar">☰ Filters</button>
  <aside id="sidebar">
    <h1>OSINT Map</h1>
    <p id="updated">Loading incidents…</p>
    <p id="status" role="status"></p>
    <form class="search-row" role="search" autocomplete="off">
      <input id="search-input" type="search" placeholder="Search port, airport, UKMTO #, city, or @handle..." aria-label="Search hotspots">
      <button id="search-clear" type="button" aria-label="Clear">×</button>
    </form>
    <div class="chips">
      <button type="button" class="chip" data-chip="UKMTO">UKMTO</button>
      <button type="button" class="chip" data-chip="Hormuz">Hormuz</button>
      <button type="button" class="chip" data-chip="Airport">Airport</button>
      <button type="button" class="chip" data-chip="Missile / Drone">Missile / Drone</button>
      <button type="button" class="chip" data-chip="Embassy">Embassy</button>
    </div>
    <p id="search-count"></p>
    <section class="group">
      <h2>Region</h2>
      <div class="row">
        <button type="button" class="pill" data-region="all" aria-pressed="true">All Regions <span class="n" data-count="all">0</span></button>
        <button type="button" class="pill" data-region="Gulf">Gulf <span class="n" data-count="Gulf">0</span></button>
        <button type="button" class="pill" data-region="Saudi &amp; Yemen">Saudi &amp; Yemen <span class="n" data-count="Saudi &amp; Yemen">0</span></button>
        <button type="button" class="pill" data-region="Levant">Levant <span class="n" data-count="Levant">0</span></button>
        <button type="button" class="pill" data-region="Iran &amp; Iraq">Iran &amp; Iraq <span class="n" data-count="Iran &amp; Iraq">0</span></button>
        <button type="button" class="pill" data-region="Maritime">Maritime <span class="n" data-count="Maritime">0</span></button>
      </div>
    </section>
    <section class="group">
      <h2>Time window</h2>
      <div class="row">
        <button type="button" class="pill" data-window="2h">Last 2 Hours</button>
        <button type="button" class="pill" data-window="24h">Last 24 Hours</button>
        <button type="button" class="pill" data-window="7d">Last 7 Days</button>
        <button type="button" class="pill" data-window="all" aria-pressed="true">All Active</button>
      </div>
    </section>
    <section class="group">
      <h2>Severity</h2>
      <div class="row">
        <button type="button" class="pill" data-severity="all" aria-pressed="true">All</button>
        <button type="button" class="pill sev-high" data-severity="high">High</button>
        <button type="button" class="pill sev-medium" data-severity="medium">Medium</button>
        <button type="button" class="pill sev-low" data-severity="low">Low</button>
      </div>
    </section>
    <section class="group">
      <h2>Category</h2>
      <div class="row">
        <button type="button" class="pill" data-category="all" aria-pressed="true">All</button>
        <button type="button" class="pill" data-category="Security Incident">Security Incident</button>
        <button type="button" class="pill" data-category="Maritime Advisory">Maritime Advisory</button>
        <button type="button" class="pill" data-category="Travel / Embassy Advisory">Travel / Embassy Advisory</button>
      </div>
    </section>
  </aside>
  <nav id="quick-jump" aria-label="Quick jump">
    <button type="button" data-jump="theater" aria-pressed="true">All Theater</button>
    <button type="button" data-jump="bahrain">Bahrain</button>
    <button type="button" data-jump="hormuz">Strait of Hormuz</button>
    <button type="button" data-jump="redsea">Red Sea &amp; Yemen</button>
    <button type="button" data-jump="levant">Levant</button>
  </nav>
  <div class="legend">
    <span><i style="background:#f43f5e"></i>High</span>
    <span><i style="background:#f59e0b"></i>Med/Low</span>
    <span><i style="background:#06b6d4"></i>Maritime</span>
    <span><i style="background:#3b82f6"></i>Travel</span>
  </div>
  <div id="map" role="application" aria-label="Incident map"></div>
  </div>
  <section id="daily-brief" aria-labelledby="brief-title">
    <article class="brief-card">
      <div class="brief-bar">
        <h2 id="brief-title">Daily Geopolitical Brief</h2>
        <time id="brief-time"></time>
        <button type="button" id="copy-brief">Copy Brief</button>
      </div>
      <div id="brief-body"><p class="headline-empty">Loading brief…</p></div>
    </article>
  </section>
  <section id="headlines" aria-labelledby="headlines-title">
    <div class="headlines-inner">
      <div class="headlines-head">
        <h2 id="headlines-title">Live X OSINT &amp; Advisory Headlines</h2>
        <button type="button" id="export-headlines">Export Filtered Headlines</button>
      </div>
      <p class="headlines-note">Same incidents as the map, newest first.</p>
      <div id="headline-list"><p class="headline-empty">Loading headlines…</p></div>
    </div>
  </section>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
  <script>
    const WINDOWS = { "2h": 2 * 3600 * 1000, "24h": 24 * 3600 * 1000, "7d": 7 * 24 * 3600 * 1000, all: null };
    const HOME = { center: [26.5, 47.0], zoom: 5 };
    const JUMPS = {
      theater: { center: [26.5, 47.0], zoom: 5 },
      bahrain: { center: [26.07, 50.55], zoom: 8 },
      hormuz: { center: [26.56, 56.25], zoom: 7 },
      redsea: { center: [15.3, 42.6], zoom: 6 },
      levant: { center: [33.5, 36.0], zoom: 6 }
    };
    const BADGES = {
      "Official / Primary": { label: "Official", cls: "badge-official" },
      "State-Affiliated / Single-Source": { label: "Attributed", cls: "badge-claim" },
      "Unverified Lead": { label: "Lead", cls: "badge-lead" }
    };
    const REGION_BOUNDS = {
      "Gulf": L.latLngBounds([16.4, 46.3], [30.2, 59.9]),
      "Saudi & Yemen": L.latLngBounds([12.1, 34.5], [32.2, 55.7]),
      "Levant": L.latLngBounds([29.1, 34.2], [37.5, 42.4]),
      "Iran & Iraq": L.latLngBounds([24.8, 38.4], [40.2, 63.4]),
      "Maritime": L.latLngBounds([11.5, 42.5], [27.2, 62.5])
    };

    const map = L.map("map", { zoomControl: false, minZoom: 2, worldCopyJump: true });
    L.control.zoom({ position: "bottomright" }).addTo(map);
    map.createPane("labels");
    map.getPane("labels").style.zIndex = 350;
    map.getPane("labels").style.pointerEvents = "none";
    const esriAttr = 'Tiles &copy; Esri &mdash; Esri, DeLorme, NAVTEQ';
    L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Base/MapServer/tile/{z}/{y}/{x}", {
      attribution: esriAttr,
      maxZoom: 16
    }).addTo(map);
    L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Reference/MapServer/tile/{z}/{y}/{x}", {
      maxZoom: 16,
      pane: "labels"
    }).addTo(map);
    map.setView(HOME.center, HOME.zoom);
    window.addEventListener("resize", () => map.invalidateSize());

    let features = [];
    let generatedAt = null;
    let clusterLayer = null;
    let loadedOnce = false;
    let timeWindow = "all";
    let severity = "all";
    let category = "all";
    let region = "all";
    let searchQuery = "";
    let searchTimer = null;
    let focusSerial = 0;
    const markers = new Map();
    let headlineExport = "Live X OSINT & Advisory Headlines\n\nNo headlines match these filters.";
    let hashApplied = false;

    const updatedEl = document.getElementById("updated");
    const statusEl = document.getElementById("status");
    const searchInput = document.getElementById("search-input");
    const searchCount = document.getElementById("search-count");
    const filterToggle = document.getElementById("filter-toggle");

    function setStatus(text) {
      statusEl.textContent = text || "";
    }

    function esc(value) {
      return String(value ?? "").replace(/[&<>"']/g, (ch) => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
      }[ch]));
    }

    function pinId(feature) {
      const props = feature.properties || {};
      if (feature.id != null && String(feature.id) !== "") return String(feature.id);
      if (props.id != null && String(props.id) !== "") return String(props.id);
      const source = String(props.source || "");
      const status = source.match(/status\/(\d+)/);
      if (status) return status[1];
      if (source) return source;
      const coords = (feature.geometry && feature.geometry.coordinates) || [];
      return [props.timestamp || "", props.title || "", coords.join(",")].join("|");
    }

    function hashPinId() {
      const match = window.location.hash.replace(/^#/, "").match(/^pin=(.*)$/);
      if (!match) return "";
      try { return decodeURIComponent(match[1]); } catch (err) { return match[1]; }
    }

    function pinShareUrl(id) {
      const url = new URL(window.location.href);
      url.hash = "pin=" + id;
      return url.href;
    }

    async function copyText(text, button, label) {
      try {
        await navigator.clipboard.writeText(text);
      } catch (err) {
        const area = document.createElement("textarea");
        area.value = text;
        document.body.appendChild(area);
        area.select();
        document.execCommand("copy");
        area.remove();
      }
      if (!button) return;
      button.textContent = "Copied!";
      window.setTimeout(() => { button.textContent = label; }, 1200);
    }

    function safeUrl(url) {
      try {
        const parsed = new URL(url);
        if (parsed.protocol === "https:" || parsed.protocol === "http:") return parsed.href;
      } catch (err) { /* leave the link off */ }
      return "";
    }

    function ageMs(timestamp) {
      const incident = new Date(timestamp);
      const incidentMs = incident.getTime();
      if (Number.isNaN(incidentMs)) return null;
      return new Date().getTime() - incidentMs;
    }

    function passesTime(timestamp, windowId) {
      if (windowId === "all") return true;
      const incident = new Date(timestamp);
      const now = new Date();
      if (Number.isNaN(incident.getTime())) return false;
      const age = now.getTime() - incident.getTime();
      if (age < -5 * 60 * 1000) return false;
      return age <= WINDOWS[windowId];
    }

    function matchesQuery(props, query) {
      if (!query) return true;
      const needle = query.trim().toLowerCase();
      if (!needle) return true;
      const handleNeedle = needle.replace(/^@/, "");
      const fields = [props.title, props.summary, props.region, props.source_handle, props.warning_number];
      return fields.some((value) => {
        if (value == null) return false;
        const text = String(value).toLowerCase();
        return text.includes(needle) || (handleNeedle !== needle && text.includes(handleNeedle));
      });
    }

    function passes(feature, opts) {
      const props = feature.properties || {};
      if (opts.severity !== "all" && props.severity !== opts.severity) return false;
      if (opts.category !== "all" && props.category !== opts.category) return false;
      if (opts.region !== "all" && props.region !== opts.region) return false;
      if (!passesTime(props.timestamp, opts.timeWindow)) return false;
      return matchesQuery(props, opts.query || "");
    }

    function currentOpts(regionId) {
      return { severity, category, region: regionId, timeWindow, query: searchQuery };
    }

    function countRegion(regionId) {
      const id = regionId === "all" ? "all" : regionId;
      return features.filter((feature) => passes(feature, currentOpts(id))).length;
    }

    function gmtStamp(timestamp) {
      const ms = Date.parse(timestamp);
      if (Number.isNaN(ms)) return "Unknown time";
      const date = new Date(ms);
      const hh = String(date.getUTCHours()).padStart(2, "0");
      const mm = String(date.getUTCMinutes()).padStart(2, "0");
      const months = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
      return date.getUTCDate() + " " + months[date.getUTCMonth()] + " " + date.getUTCFullYear() + ", " + hh + ":" + mm + " GMT";
    }

    function readGeneratedAt(data) {
      const raw = data && data.generated_at;
      if (raw == null || raw === "") return null;
      const ms = typeof raw === "number" ? raw : Date.parse(raw);
      if (!Number.isFinite(ms)) return null;
      return new Date(ms).toISOString();
    }

    function headlineBadge(props) {
      const tier = String(props.verification_tier || "");
      const flag = props.corroborated;
      const saysCorroborated = tier === "Corroborated" || flag === true || String(flag || props.verification || "").trim().toLowerCase() === "corroborated";
      if (saysCorroborated) return { label: "Corroborated", cls: "badge-corroborated" };
      if (tier === "Official / Primary") return { label: "Verified Official", cls: "badge-official" };
      if (tier === "Attributed" || tier === "State-Affiliated / Single-Source") return { label: "Attributed", cls: "badge-claim" };
      if (tier === "Unverified Lead") return { label: "Unverified Lead", cls: "badge-lead" };
      return { label: tier || "Unverified Lead", cls: "badge-unknown" };
    }

    function twoSentences(text) {
      const clean = String(text || "").replace(/\s+/g, " ").trim();
      if (!clean) return "";
      const parts = clean.match(/[^.!?]+[.!?]+|[^.!?]+$/g) || [clean];
      return parts.slice(0, 2).join(" ").trim();
    }

    function pinColor(props) {
      if (props.category === "Maritime Advisory") return "#06b6d4";
      if (props.category === "Travel / Embassy Advisory") return "#3b82f6";
      if (props.severity === "high") return "#f43f5e";
      return "#f59e0b";
    }

    function popupHtml(props, id) {
      const badge = BADGES[props.verification_tier] || { label: "Lead", cls: "badge-unknown" };
      const headline = props.title || props.summary || "Incident";
      const href = safeUrl(props.source);
      const link = href
        ? '<a class="popup-link" href="' + esc(href) + '" target="_blank" rel="noopener noreferrer">View Source ↗</a>'
        : "";
      return (
        '<div class="popup">' +
          "<h3>" + esc(headline) + "</h3>" +
          '<span class="badge ' + badge.cls + '">' + esc(badge.label) + "</span>" +
          '<p class="summary">' + esc(props.summary || "") + "</p>" +
          '<div class="when">' + esc(gmtStamp(props.timestamp)) + "</div>" +
          '<div class="popup-actions">' + link +
            '<button type="button" class="copy-pin" data-pin="' + esc(id) + '">Copy Link</button>' +
          "</div>" +
        "</div>"
      );
    }

    function markerFor(feature) {
      const coords = feature.geometry.coordinates;
      const props = feature.properties || {};
      const id = pinId(feature);
      const age = ageMs(props.timestamp);
      const fresh = age !== null && age >= 0 && age <= WINDOWS["2h"];
      const old = age !== null && age > WINDOWS["24h"];
      const classes = ["pin"];
      if (fresh) classes.push("is-fresh");
      if (old) classes.push("is-old");
      const color = pinColor(props);
      const icon = L.divIcon({
        className: "pin-icon",
        html: '<div class="' + classes.join(" ") + '" style="color:' + color + '"><span class="ring"></span><span class="dot"></span></div>',
        iconSize: [22, 22],
        iconAnchor: [11, 11],
        popupAnchor: [0, -10]
      });
      return L.marker([coords[1], coords[0]], { icon }).bindPopup(popupHtml(props, id), { maxWidth: 300, minWidth: 180 });
    }

    function syncControls(visibleCount) {
      document.querySelectorAll("[data-window]").forEach((button) => {
        button.setAttribute("aria-pressed", String(button.dataset.window === timeWindow));
      });
      document.querySelectorAll("[data-severity]").forEach((button) => {
        button.setAttribute("aria-pressed", String(button.dataset.severity === severity));
      });
      document.querySelectorAll("[data-category]").forEach((button) => {
        button.setAttribute("aria-pressed", String(button.dataset.category === category));
      });
      document.querySelectorAll("[data-region]").forEach((button) => {
        button.setAttribute("aria-pressed", String(button.dataset.region === region));
      });
      document.querySelectorAll("[data-count]").forEach((node) => {
        node.textContent = String(countRegion(node.dataset.count));
      });
      const newest = features.reduce((best, feature) => {
        const ms = Date.parse((feature.properties || {}).timestamp);
        if (Number.isNaN(ms)) return best;
        return best === null || ms > best ? ms : best;
      }, null);
      const noun = visibleCount === 1 ? "incident" : "incidents";
      const generated = generatedAt ? gmtStamp(generatedAt) : "Unknown time";
      const stamp = generated !== "Unknown time"
        ? generated
        : (newest === null ? "No timestamps" : gmtStamp(new Date(newest).toISOString()));
      updatedEl.textContent = stamp + " · " + visibleCount + " " + noun;
    }

    function updateSearchCount(visibleCount) {
      if (!searchQuery) {
        searchCount.textContent = "";
        return;
      }
      const noun = visibleCount === 1 ? "hotspot" : "hotspots";
      searchCount.textContent = "Showing " + visibleCount + " matching " + noun;
    }

    function focusMatches(visible) {
      const serial = ++focusSerial;
      if (visible.length === 1) {
        const marker = markers.get((visible[0].properties || {}).source);
        if (!marker) return;
        const latlng = marker.getLatLng();
        const open = () => {
          if (serial !== focusSerial) return;
          marker.openPopup();
        };
        map.flyTo(latlng, 8, { duration: 0.6 });
        map.once("moveend", open);
        window.setTimeout(open, 700);
        return;
      }
      if (visible.length > 1) {
        const bounds = L.latLngBounds(visible.map((feature) => [
          feature.geometry.coordinates[1],
          feature.geometry.coordinates[0]
        ]));
        map.fitBounds(bounds, { padding: [48, 48], duration: 0.6, maxZoom: 7 });
      }
    }

    function flyToRegion(regionId) {
      if (!regionId || regionId === "all") {
        map.flyTo(HOME.center, HOME.zoom, { duration: 0.75 });
        return;
      }
      const bounds = REGION_BOUNDS[regionId];
      if (bounds) map.flyToBounds(bounds, { padding: [48, 48], duration: 0.75, maxZoom: 6 });
    }

    function returnToRegion() {
      focusSerial += 1;
      map.closePopup();
      flyToRegion(region);
    }

    function render(focusMode) {
      if (clusterLayer) map.removeLayer(clusterLayer);
      markers.clear();
      clusterLayer = L.markerClusterGroup({ showCoverageOnHover: false, maxClusterRadius: 42, spiderfyOnMaxZoom: true });
      const visible = features.filter((feature) => passes(feature, currentOpts(region)));
      visible.forEach((feature) => {
        const marker = markerFor(feature);
        markers.set((feature.properties || {}).source, marker);
        clusterLayer.addLayer(marker);
      });
      map.addLayer(clusterLayer);
      syncControls(visible.length);
      updateSearchCount(visible.length);
      renderHeadlines(visible);
      if (loadedOnce) {
        setStatus(features.length && !visible.length ? "No incidents match these filters." : "");
      }
      if (focusMode === "search") focusMatches(visible);
      else if (focusMode === "clear") returnToRegion();
      else if (focusMode === "region") flyToRegion(region);
    }

    function applyQuery(value, forcedMode) {
      const previous = searchQuery;
      searchQuery = String(value || "").trim();
      let mode = forcedMode;
      if (!mode) {
        if (searchQuery) mode = "search";
        else if (previous) mode = "clear";
        else mode = "none";
      }
      render(mode);
    }

    function renderHeadlines(visible) {
      const list = document.getElementById("headline-list");
      const sorted = visible.slice().sort((a, b) => {
        const am = Date.parse((a.properties || {}).timestamp);
        const bm = Date.parse((b.properties || {}).timestamp);
        return (Number.isNaN(bm) ? 0 : bm) - (Number.isNaN(am) ? 0 : am);
      });
      if (!sorted.length) {
        headlineExport = "Live X OSINT & Advisory Headlines\n\nNo headlines match these filters.";
        list.innerHTML = '<p class="headline-empty">No headlines match these filters.</p>';
        return;
      }
      headlineExport = "Live X OSINT & Advisory Headlines\n\n" + sorted.map((feature) => {
        const props = feature.properties || {};
        const badge = headlineBadge(props);
        const href = safeUrl(props.source);
        return [
          props.title || props.summary || "Incident",
          badge.label,
          gmtStamp(props.timestamp),
          twoSentences(props.summary),
          href
        ].filter(Boolean).join("\n");
      }).join("\n\n");
      list.innerHTML = sorted.map((feature) => {
        const props = feature.properties || {};
        const badge = headlineBadge(props);
        const href = safeUrl(props.source);
        const source = href
          ? '<a class="headline-source" href="' + esc(href) + '" target="_blank" rel="noopener noreferrer">View Source</a>'
          : "";
        return (
          '<article class="headline-card">' +
            '<div class="headline-meta">' +
              '<span class="badge ' + badge.cls + '">' + esc(badge.label) + "</span>" +
              '<span class="region-tag">' + esc(props.region || "") + "</span>" +
              "<time>" + esc(gmtStamp(props.timestamp)) + "</time>" +
            "</div>" +
            "<h3>" + esc(props.title || props.summary || "Incident") + "</h3>" +
            '<p class="summary">' + esc(twoSentences(props.summary)) + "</p>" +
            '<div class="headline-actions">' +
              source +
              '<button type="button" class="locate" data-locate="' + esc(props.source || "") + '">Locate on Map</button>' +
            "</div>" +
          "</article>"
        );
      }).join("");
    }

    function locateFeature(source) {
      const marker = markers.get(source);
      if (!marker) return;
      const stage = document.getElementById("stage");
      const top = stage ? stage.getBoundingClientRect().top + window.scrollY : 0;
      window.scrollTo({ top: Math.max(0, top), behavior: "smooth" });
      const open = () => {
        const parent = clusterLayer && clusterLayer.getVisibleParent(marker);
        if (parent && parent !== marker && typeof clusterLayer.zoomToShowLayer === "function") {
          clusterLayer.zoomToShowLayer(marker, () => marker.openPopup());
          return;
        }
        marker.openPopup();
      };
      window.setTimeout(() => {
        map.invalidateSize();
        map.flyTo(marker.getLatLng(), 8, { duration: 0.6 });
        map.once("moveend", open);
        window.setTimeout(open, 750);
      }, 450);
    }

    function openHashedPin() {
      const id = hashPinId();
      if (!id) return;
      const feature = features.find((item) => pinId(item) === id);
      if (!feature) return;
      const marker = markers.get((feature.properties || {}).source);
      const latlng = L.latLng(feature.geometry.coordinates[1], feature.geometry.coordinates[0]);
      const stage = document.getElementById("stage");
      const top = stage ? stage.getBoundingClientRect().top + window.scrollY : 0;
      window.scrollTo({ top: Math.max(0, top), behavior: "smooth" });
      const open = () => {
        if (!marker) return;
        const parent = clusterLayer && clusterLayer.getVisibleParent(marker);
        if (parent && parent !== marker && typeof clusterLayer.zoomToShowLayer === "function") {
          clusterLayer.zoomToShowLayer(marker, () => marker.openPopup());
          return;
        }
        marker.openPopup();
      };
      window.setTimeout(() => {
        map.invalidateSize();
        map.flyTo(latlng, 8, { duration: 0.6 });
        map.once("moveend", open);
        window.setTimeout(open, 750);
      }, 200);
    }

    function isPoint(feature) {
      const coords = feature && feature.geometry && feature.geometry.coordinates;
      return feature && feature.type === "Feature" && feature.geometry.type === "Point" &&
        Array.isArray(coords) && Number.isFinite(coords[0]) && Number.isFinite(coords[1]);
    }

    async function loadHotspots() {
      try {
        const response = await fetch("hotspots.json?v=" + Date.now(), { cache: "no-store" });
        if (!response.ok) throw new Error("HTTP " + response.status);
        const data = await response.json();
        if (!data || data.type !== "FeatureCollection" || !Array.isArray(data.features)) {
          throw new Error("invalid");
        }
        features = data.features.filter(isPoint);
        generatedAt = readGeneratedAt(data);
        loadedOnce = true;
        setStatus(features.length ? "" : "No incidents in hotspots.json.");
        render();
        if (!hashApplied) {
          hashApplied = true;
          openHashedPin();
        }
      } catch (err) {
        setStatus("Could not load hotspots.json.");
        if (!loadedOnce) {
          features = [];
          render();
        }
      }
    }

    document.getElementById("sidebar").addEventListener("click", (event) => {
      const button = event.target.closest("button");
      if (!button || button.id === "search-clear") return;
      const chip = button.dataset.chip;
      if (chip) {
        clearTimeout(searchTimer);
        searchInput.value = chip;
        applyQuery(chip, "search");
        return;
      }
      if (button.dataset.window) timeWindow = button.dataset.window;
      if (button.dataset.severity) severity = button.dataset.severity;
      if (button.dataset.category) category = button.dataset.category;
      if (button.dataset.region) {
        region = button.dataset.region;
        render(searchQuery ? "search" : "region");
        return;
      }
      if (button.dataset.window || button.dataset.severity || button.dataset.category) {
        render(searchQuery ? "search" : "none");
      }
    });

    searchInput.addEventListener("input", () => {
      clearTimeout(searchTimer);
      searchTimer = setTimeout(() => applyQuery(searchInput.value), 200);
    });
    document.getElementById("search-clear").addEventListener("click", () => {
      clearTimeout(searchTimer);
      if (!searchInput.value && !searchQuery) return;
      searchInput.value = "";
      applyQuery("", "clear");
    });
    document.querySelector("#sidebar form").addEventListener("submit", (event) => {
      event.preventDefault();
      clearTimeout(searchTimer);
      applyQuery(searchInput.value, searchInput.value.trim() ? "search" : "clear");
    });
    filterToggle.addEventListener("click", () => {
      const open = document.body.classList.toggle("filters-open");
      document.body.classList.toggle("filters-closed", !open);
      filterToggle.setAttribute("aria-expanded", String(open));
    });

    document.getElementById("quick-jump").addEventListener("click", (event) => {
      const button = event.target.closest("[data-jump]");
      if (!button) return;
      const jump = JUMPS[button.dataset.jump];
      if (!jump) return;
      focusSerial += 1;
      map.closePopup();
      map.flyTo(jump.center, jump.zoom, { duration: 0.6 });
      document.querySelectorAll("#quick-jump button").forEach((item) => {
        item.setAttribute("aria-pressed", String(item === button));
      });
    });

    document.getElementById("headline-list").addEventListener("click", (event) => {
      const button = event.target.closest("[data-locate]");
      if (!button) return;
      locateFeature(button.dataset.locate);
    });

    let briefText = "";

    const BRIEF_SECTIONS = ["Gulf & Maritime Security", "Yemen & Red Sea", "Levant & Regional Politics"];
    const ADVISORY_TITLE = "Official Travel & Embassy Advisories";

    function briefBullets(text) {
      return String(text || "").split(/\n|•/).map((line) => line.trim()).filter(Boolean);
    }

    function bulletHtml(text) {
      const match = /^(Verified Official|Corroborated|Attributed)\s*[—–:-]\s*/i.exec(text);
      if (!match) return "<li><span>" + esc(text) + "</span></li>";
      const tag = match[1].toLowerCase().startsWith("verified")
        ? "Verified Official"
        : match[1].toLowerCase().startsWith("corrobor")
          ? "Corroborated"
          : "Attributed";
      const cls = tag === "Verified Official" ? "badge-official" : tag === "Corroborated" ? "badge-corroborated" : "badge-claim";
      return "<li><span class=\"badge " + cls + "\">" + esc(tag) + "</span><span>" + esc(text.slice(match[0].length)) + "</span></li>";
    }

    function briefSection(title, bullets) {
      const id = "brief-sec-" + title.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");
      const items = bullets.length ? bullets : ["Nothing new in the last 24 hours."];
      return "<div class=\"brief-section\"><button type=\"button\" class=\"brief-section-toggle\" aria-expanded=\"true\" aria-controls=\"" + id + "\">" + esc(title) + "</button><div class=\"brief-section-body\" id=\"" + id + "\"><ul>" + items.map(bulletHtml).join("") + "</ul></div></div>";
    }

    function renderBrief(data) {
      const body = document.getElementById("brief-body");
      const time = document.getElementById("brief-time");
      if (!data || !data.executive_summary) {
        time.textContent = "";
        time.removeAttribute("datetime");
        briefText = "";
        body.innerHTML = '<p class="headline-empty">No daily brief yet.</p>';
        return;
      }
      const stamp = gmtStamp(data.generated_at);
      if (data.generated_at) time.setAttribute("datetime", data.generated_at);
      time.textContent = stamp === "Unknown time" ? "" : stamp;
      const byTitle = new Map();
      (Array.isArray(data.regional_sections) ? data.regional_sections : []).forEach((item) => {
        byTitle.set(item.region, briefBullets(item.summary));
      });
      const highlights = (Array.isArray(data.advisory_highlights) ? data.advisory_highlights : []).flatMap(briefBullets);
      body.innerHTML =
        briefSection("Executive Summary", [data.executive_summary]) +
        BRIEF_SECTIONS.map((title) => briefSection(title, byTitle.get(title) || [])).join("") +
        briefSection(ADVISORY_TITLE, highlights);
      const lines = ["Daily Geopolitical Brief", stamp, "", "Executive Summary", data.executive_summary, ""];
      BRIEF_SECTIONS.forEach((title) => {
        lines.push(title);
        (byTitle.get(title) || ["Nothing new in the last 24 hours."]).forEach((item) => lines.push("- " + item));
        lines.push("");
      });
      lines.push(ADVISORY_TITLE);
      (highlights.length ? highlights : ["Nothing new in the last 24 hours."]).forEach((item) => lines.push("- " + item));
      briefText = lines.join("\n").trim();
    }

    async function loadBrief() {
      try {
        const response = await fetch(`daily_brief.json?v=${Date.now()}`, { cache: "no-store" });
        if (!response.ok) throw new Error("HTTP " + response.status);
        renderBrief(await response.json());
      } catch (err) {
        renderBrief(null);
      }
    }

    document.getElementById("daily-brief").addEventListener("click", (event) => {
      const button = event.target.closest(".brief-section-toggle");
      if (!button) return;
      const panel = document.getElementById(button.getAttribute("aria-controls"));
      if (!panel) return;
      const open = panel.hasAttribute("hidden");
      if (open) panel.removeAttribute("hidden");
      else panel.setAttribute("hidden", "");
      button.setAttribute("aria-expanded", String(open));
    });
    document.addEventListener("click", (event) => {
      const button = event.target.closest(".copy-pin");
      if (!button) return;
      event.preventDefault();
      const id = button.getAttribute("data-pin") || "";
      const url = pinShareUrl(id);
      if (window.location.href !== url) history.replaceState(null, "", url);
      copyText(url, button, "Copy Link");
    });
    document.getElementById("export-headlines").addEventListener("click", () => {
      copyText(headlineExport, document.getElementById("export-headlines"), "Export Filtered Headlines");
    });
    document.getElementById("copy-brief").addEventListener("click", () => {
      if (!briefText) return;
      copyText(briefText, document.getElementById("copy-brief"), "Copy Brief");
    });
    window.addEventListener("hashchange", () => openHashedPin());

    loadHotspots();
    loadBrief();
    setInterval(loadHotspots, 60000);
    setInterval(loadBrief, 60000);
  </script>
</body>
</html>
