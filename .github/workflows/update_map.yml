
name: Update OSINT Hotspots
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - env:
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
        run: |
          python fetch_x_osint.py
          python fetch_web_advisories.py
      - run: |
          git config user.name "OSINT Bot"
          git config user.email "bot@://github.com"
          git add hotspots.json archive.json || git add hotspots.json
          git commit -m "Update live hotspots" || exit 0
          git push

